    <text x="933" y="506"><tspan fill="#a6e7c3" font-weight="700">A</tspan><tspan dx="6">Album</tspan></text>
    <text x="1053" y="506"><tspan fill="#a6e7c3" font-weight="700">T</tspan><tspan dx="6">Trash</tspan></text>
