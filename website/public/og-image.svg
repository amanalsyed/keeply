<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101512"/>
      <stop offset="1" stop-color="#17211a"/>
    </linearGradient>
    <linearGradient id="scene" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54736f"/>
      <stop offset=".56" stop-color="#9fb99d"/>
      <stop offset="1" stop-color="#293f39"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#a6e7c3" stop-opacity=".16"/>
      <stop offset="1" stop-color="#a6e7c3" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="photoClip"><rect x="750" y="192" width="365" height="278" rx="12"/></clipPath>
