    <path d="M21 17v30M43 18 26 32l19 15" fill="none" stroke="#101512" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="166" y="127" fill="#f4f4ed" font-family="Poppins,Arial,sans-serif" font-size="42" font-weight="600" letter-spacing="-1">Keeply</text>
  <text x="88" y="244" fill="#a6e7c3" font-family="Poppins,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">LOCAL PHOTO TRIAGE FOR WINDOWS</text>
  <text x="84" y="340" fill="#f4f4ed" font-family="Poppins,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-2.5">Sort your photos,</text>
  <text x="84" y="418" fill="#f4f4ed" font-family="Poppins,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-2.5">one at a time.</text>
  <text x="88" y="478" fill="#a0aaa2" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="400">Keep it, trash it, or save it to an album.</text>
  <rect x="88" y="526" width="250" height="40" rx="20" fill="#1b2820" stroke="#32483a"/>
  <circle cx="110" cy="546" r="5" fill="#a6e7c3"/>
  <text x="126" y="551" fill="#c8d8cd" font-family="Poppins,Arial,sans-serif" font-size="13" font-weight="500" letter-spacing=".5">YOUR PHOTOS STAY ON YOUR PC</text>

  <rect x="714" y="105" width="438" height="430" rx="22" fill="#171e1a" stroke="#354138" stroke-width="2"/>
  <circle cx="746" cy="139" r="5" fill="#526057"/>
  <circle cx="764" cy="139" r="5" fill="#526057"/>
  <circle cx="782" cy="139" r="5" fill="#526057"/>
  <text x="933" y="144" text-anchor="middle" fill="#c3ccc5" font-family="Poppins,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">KEEPLY</text>
  <text x="1116" y="144" text-anchor="end" fill="#e4eae5" font-family="Poppins,Arial,sans-serif" font-size="13" font-weight="600">127 / 2,000</text>
  <rect x="750" y="192" width="365" height="278" rx="12" fill="url(#scene)"/>
